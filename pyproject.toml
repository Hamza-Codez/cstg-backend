[project]
name = "support-engine-api"
version = "0.1.0"
description = "Customer Support Ticket & SLA Automation Engine — API"
requires-python = ">=3.12,<3.13"

# P0 declares only what the walking skeleton needs plus the persistence foundation.
# Auth libraries (argon2, JWT) arrive in P2; nothing here anticipates a later phase.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "PyJWT>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── pytest ───────────────────────────────────────────────────────────────────
# Layers per docs/TESTING.md §1: unit (pure domain, no DB) · integration
# (services + real DB) · api (routers, auth, authz).
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "db: test requires the disposable PostgreSQL container",
]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# B008 is a false positive for FastAPI: Depends()/require_roles() in argument
# defaults is the framework's intended idiom, so allow those calls by name
# rather than disabling the rule everywhere.
ignore = ["UP046"]  # PEP 695 generics: pydantic generic models still use Generic[T]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "app.core.authorization.require_roles",
]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

